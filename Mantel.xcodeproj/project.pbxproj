			shellScript = "set -e\n# The kit's example block, which onboarding and the empty Blocks page offer to\n# install: product HelloBlock from Packages/BlockKit, packaged into\n# Contents/Resources/Examples/Hello.mantelblock. It is not run from there; it is\n# installed like any other block, through the review sheet. Built for this\n# Mac, Debug, by a nested swift build with a cleared environment, so Xcode's\n# build settings do not leak into it, in its own scratch folder in the derived\n# data folder, outside the source tree. The phase always runs; swift build\n# itself skips the work when nothing changed.\nproduct=HelloBlock\nexamples=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Examples\"\nswift_build() {\n\tenv -i PATH=\"$PATH\" HOME=\"$HOME\" ${DEVELOPER_DIR:+DEVELOPER_DIR=\"$DEVELOPER_DIR\"} \\\n\t\tswift build -c debug --package-path \"$SRCROOT/Packages/BlockKit\" --scratch-path \"$BUILD_DIR/../../block-builds/BlockKit\" --product \"$product\" \"$@\"\n}\nswift_build\nbin=$(swift_build --show-bin-path)\n# Package and sign only when the executable or manifest changed: a new\n# signature on every build would break the app's seal when Xcode does not\n# sign the app again.\nmanifest=\"$SRCROOT/Packages/BlockKit/Examples/HelloBlock/manifest.json\"\npackaged=\"$examples/Hello.mantelblock\"\n# The stamp is per configuration: one shared stamp let a Release build make a\n# later Debug build skip a changed block.\nstamp=\"$TARGET_TEMP_DIR/$product.packaged\"\nif [ -x \"$packaged/Contents/MacOS/$product\" ] && cmp -s \"$bin/$product\" \"$stamp\" && cmp -s \"$manifest\" \"$packaged/Contents/Resources/manifest.json\"; then\n\techo \"Hello.mantelblock is up to date\"\n\texit 0\nfi\n# The script signs the whole bundle, with the app's identity. It names the\n# bundle after the manifest's name, so it packages into a folder of its own\n# and the bundle is moved to Hello.mantelblock; the signature does not cover the\n# folder name. No secure timestamp, so a build without network access still\n# signs.\nout=\"$TARGET_TEMP_DIR/packaging/$product\"\nrm -rf \"$out\"\nBLOCK_SIGN_TIMESTAMP=none BLOCK_SIGN_IDENTITY=\"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$SRCROOT/Packages/BlockKit/Scripts/package-block.sh\" \"$bin/$product\" \"$manifest\" \"$out\"\nmkdir -p \"$examples\"\nrm -rf \"$packaged\"\nmv \"$out\"/*.mantelblock \"$packaged\"\ncp \"$bin/$product\" \"$stamp\"\n";

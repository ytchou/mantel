			shellScript = "set -e\n# The bundled blocks, each run by BlockHost as its own process: Blocks/<name>\n# for each name below, product <name>. Each is built for this Mac, Debug, by a\n# nested swift build with a cleared environment, so Xcode's build settings do\n# not leak into it. Each has its own scratch folder in the derived data\n# folder, outside the source tree. The phase always runs; swift build itself\n# skips the work when nothing changed.\n# One scratch folder per package: a shared one would need one package that\n# builds all three. Switch to that if a clean build gets too slow.\nblocks=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Blocks\"\nswift_build() {\n\tenv -i PATH=\"$PATH\" HOME=\"$HOME\" ${DEVELOPER_DIR:+DEVELOPER_DIR=\"$DEVELOPER_DIR\"} \\\n\t\tswift build -c debug --package-path \"$SRCROOT/Blocks/$name\" --scratch-path \"$BUILD_DIR/../../block-builds/$name\" --product \"$name\" \"$@\"\n}\nfor name in NowPlaying Shelf Rename; do\n\tswift_build\n\tbin=$(swift_build --show-bin-path)\n\t# Package and sign only when the executable or manifest changed: a new\n\t# signature on every build would break the app's seal when Xcode does not\n\t# sign the app again.\n\tmanifest=\"$SRCROOT/Blocks/$name/manifest.json\"\n\tpackaged=\"$blocks/$name.topblock\"\n\t# The stamp is per configuration, beside its package's build: one shared\n\t# stamp let a Release build make a later Debug build skip a changed block.\n\tstamp=\"$TARGET_TEMP_DIR/$name.packaged\"\n\tif [ -x \"$packaged/Contents/MacOS/$name\" ] && cmp -s \"$bin/$name\" \"$stamp\" && cmp -s \"$manifest\" \"$packaged/Contents/Resources/manifest.json\"; then\n\t\techo \"$name.topblock is up to date\"\n\t\tcontinue\n\tfi\n\t# The script signs the whole bundle, with the app's identity. It names the\n\t# bundle after the manifest's name (\"ScreenshotNames\" for Rename), so it\n\t# packages into a folder of its own and the bundle is moved to\n\t# <name>.topblock; the signature does not cover the folder name. No secure\n\t# timestamp, so a build without network access still signs.\n\tout=\"$TARGET_TEMP_DIR/packaging/$name\"\n\trm -rf \"$out\"\n\tBLOCK_SIGN_TIMESTAMP=none BLOCK_SIGN_IDENTITY=\"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$SRCROOT/Packages/BlockKit/Scripts/package-block.sh\" \"$bin/$name\" \"$manifest\" \"$out\"\n\tmkdir -p \"$blocks\"\n\trm -rf \"$packaged\"\n\tmv \"$out\"/*.topblock \"$packaged\"\n\tcp \"$bin/$name\" \"$stamp\"\ndone\n";
